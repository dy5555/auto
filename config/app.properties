# 개발 DB
dev.url=jdbc:oracle:thin:@127.0.0.1:1521:ORCL
dev.user=DEV_USER
dev.password=DEV_PASSWORD

# 운영 DB
prod.url=jdbc:oracle:thin:@127.0.0.1:1521:ORCL
prod.user=PROD_USER
prod.password=PROD_PASSWORD

# 조회 SQL
# 반드시 ? 파라미터 2개를 사용합니다.
# 1번째 ?: 시작일 포함
# 2번째 ?: 종료일 다음날 미만
# 아래 10개 alias를 실제 컬럼명에 맞게 수정하세요.
query.procedureStatus=SELECT A.STATUS AS STATUS, A.PROC_NAME AS PROC_NAME, A.JOB_ID AS JOB_ID, A.START_TIME AS START_TIME, A.END_TIME AS END_TIME, A.ELAPSED_SEC AS ELAPSED_SEC, A.TARGET_DATE AS TARGET_DATE, A.PROCESS_COUNT AS PROCESS_COUNT, A.ERROR_CODE AS ERROR_CODE, A.ERROR_MESSAGE AS ERROR_MESSAGE FROM PROCEDURE_LOG A WHERE A.START_TIME >= ? AND A.START_TIME < ? ORDER BY A.START_TIME DESC
